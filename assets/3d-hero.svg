<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Gradiente del texto -->
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#95aaa5"/>
      <stop offset="50%" style="stop-color:#608078"/>
      <stop offset="100%" style="stop-color:#4f7269"/>
    </linearGradient>

    <!-- Gradiente acento -->
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#4ecdc4;stop-opacity:0.8"/>
    </linearGradient>

    <!-- Filtros -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animaciones -->
    <style>
      @keyframes flicker { 
        0%,100%{opacity:.3;}50%{opacity:1;} 
      }
      @keyframes slide {
        0% {transform: translateX(-20px);}
        100% {transform: translateX(20px);}
      }
      @keyframes pulse {
        0%,100%{opacity:0.6;}50%{opacity:1;}
      }
    </style>
    <!-- Elementos del fondo cósmico -->
    <circle stroke='#4F7269' vector-effect='non-scaling-stroke' id='a' fill='none' stroke-width='10' r='420' />
    <use id='f' href='#a' stroke-dasharray='100 100 100 9999'/>
    <use id='b' href='#a' stroke-dasharray='250 250 250 250 250 9999'/>
    <use id='e' href='#a' stroke-dasharray='1000 500 1000 500 9999'/>
    <use id='g' href='#a' stroke-dasharray='1500 9999'/>
    <use id='h' href='#a' stroke-dasharray='2000 500 500 9999'/>
    <use id='j' href='#a' stroke-dasharray='800 800 800 800 800 9999'/>
    <use id='k' href='#a' stroke-dasharray='1200 1200 1200 1200 1200 9999'/>
    <use id='l' href='#a' stroke-dasharray='1600 1600 1600 1600 1600 9999'/>

  </defs>

  <!-- Fondo cósmico -->
<!-- Fondo cósmico adaptado -->

<!--
<animateTransform 
    attributeName="transform"
    type="rotate"
    from="0 0 0"
    to="360 0 0"
    dur="20s"
    repeatCount="indefinite" />

-->
  <rect fill='#03091D' width='1200' height='400'/>
  <g transform='translate(600 200)' stroke-opacity='0.35' >
    <g transform='rotate(212.4 0 0)'>
      <circle fill='#1D1D6F' fill-opacity='0.35' r='8'  />
      
      <!--165-->
      <g transform='rotate(-165 0 0)' >
        <use href='#f' transform='scale(.08) rotate(50 0 0)'  />
        <animateTransform 
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="3s"
        repeatCount="indefinite" />        
      </g>
      
      <g transform='rotate(-165 0 0)' >
        <use href='#f' transform='scale(.15) rotate(100 0 0)' />
        <animateTransform 
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="6s"
        repeatCount="indefinite" />
      </g>
      
       <g transform='rotate(-165 0 0)' >
        <use href='#f' transform='scale(.22) rotate(150 0 0)' />
        <animateTransform 
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="8s"
        repeatCount="indefinite" />
      </g>
      
      
      <g transform='rotate(-52.8 0 0)'>
        <use href='#b' transform='scale(.3) rotate(200 0 0)' />
        <animateTransform 
        attributeName="transform"
        type="rotate"
        from="0 0 0"
        to="360 0 0"
        dur="10s"
        repeatCount="indefinite" />
      </g>
      
      <g transform='rotate(74.25 0 0)'>
        <g transform='rotate(132.75 0 0)'>
          <use href='#b' transform='scale(.4)'/>
          <animateTransform 
            attributeName="transform"
            type="rotate"
            from="0 0 0"
            to="360 0 0"
            dur="15s"
            repeatCount="indefinite" />
        </g>
        <g transform='rotate(132.75 0 0)'>
          <use href='#b' transform='scale(.5) rotate(90 0 0)' />
          <animateTransform 
            attributeName="transform"
            type="rotate"
            from="0 0 0"
            to="360 0 0"
            dur="25s"
            repeatCount="indefinite" />
        </g>
        <g transform='rotate(132.75 0 0)'>
          <use href='#e' transform='scale(.6) rotate(120 0 0)' />
          <animateTransform 
            attributeName="transform"
            type="rotate"
            from="0 0 0"
            to="360 0 0"
            dur="35s"
            repeatCount="indefinite" />
        </g>
      </g>
    </g>
  </g>

  <!-- Grid pattern futurista sutil -->
  <g opacity="0.08">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="#00d9ff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="#00d9ff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#00d9ff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#00d9ff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#00d9ff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#00d9ff" stroke-width="1"/>
  </g>

  <!-- *** NUEVOS ELEMENTOS MINIMALISTAS FUTURISTAS *** -->

  <!-- Líneas tipo PCB -->
  <g opacity="0.18" stroke="#00d9ff" stroke-width="1">
    <polyline points="80,50 150,50 150,120 250,120" fill="none"/>
    <circle cx="150" cy="50" r="3" fill="#00d9ff"/>
    <circle cx="150" cy="120" r="3" fill="#00d9ff"/>
  </g>

  <g opacity="0.18" stroke="#4ecdc4" stroke-width="1">
    <polyline points="1100,300 1020,300 1020,250 950,250" fill="none"/>
    <circle cx="1020" cy="300" r="3" fill="#4ecdc4"/>
    <circle cx="1020" cy="250" r="3" fill="#4ecdc4"/>
  </g>

  <!-- Flechas tecnológicas minimalistas -->
  <g opacity="0.4" stroke="#36d1dc" stroke-width="2" style="animation: slide 6s ease-in-out infinite alternate;">
    <polyline points="400,340 420,330 400,320" fill="none"/>
    <polyline points="800,60 780,70 800,80" fill="none"/>
  </g>

  <!-- Brackets estilizados -->
  <g opacity="0.25" stroke="#00d9ff" stroke-width="2">
    <polyline points="70,180 50,180 50,140 70,140" fill="none"/>
    <polyline points="1130,180 1150,180 1150,140 1130,140" fill="none"/>
  </g>

  <!-- Indicadores futuristas (HUD) -->
  <g opacity="0.35">
    <rect x="550" y="300" width="100" height="8" fill="#b8c6c3" rx="2"/>
    <rect x="550" y="315" width="70" height="6" fill="#95aaa5" rx="2"/>
    <rect x="550" y="328" width="40" height="4" fill="#728e87" rx="2"/>
  </g>

  <!-- Puntos alineados estilo interfaz -->
  <g opacity="0.4" fill="#00d9ff">
    <circle cx="300" cy="70" r="3"/>
    <circle cx="320" cy="70" r="3"/>
    <circle cx="340" cy="70" r="3"/>
  </g>

  <g opacity="0.4" fill="#ff6b6b">
    <circle cx="900" cy="330" r="3"/>
    <circle cx="920" cy="330" r="3"/>
    <circle cx="940" cy="330" r="3"/>
  </g>

  <!-- Coordenadas HUD -->
  <text x="100" y="360" font-size="12" fill="#4ecdc4" opacity="0.4">X:100 Y:360</text>
  <text x="1000" y="60" font-size="12" fill="#36d1dc" opacity="0.4">X:1000 Y:60</text>

  <!-- *** TEXTO PRINCIPAL *** -->

  <g filter="url(#shadow)">
    <text x="600" y="160" font-family="'Arial Black', sans-serif" font-size="72" 
          font-weight="bold" text-anchor="middle" fill="#0f1419">Alberto Lombera</text>
    <text x="598" y="158" font-family="'Arial Black', sans-serif" font-size="72" 
          font-weight="bold" text-anchor="middle" fill="#03091D">Alberto Lombera</text>
    <text x="596" y="156" font-family="'Arial Black', sans-serif" font-size="72" 
          font-weight="bold" text-anchor="middle" fill="url(#text-gradient)" 
          filter="url(#glow)">Alberto Lombera</text>
  </g>

  <!-- Subtítulo -->
  <text x="600" y="220" font-family="'Courier New', monospace" font-size="28" 
        text-anchor="middle" fill="#b8c6c3" opacity="0.9">
    Mechatronics Engineer
  </text>

  <line x1="350" y1="240" x2="850" y2="240" stroke="url(#accent-gradient)" stroke-width="2" opacity="0.7"/>

  <text x="600" y="280" font-family="'Arial', sans-serif" font-size="18" 
        text-anchor="middle" fill="#839c96" letter-spacing="2">
    Think. Code. Evolve.
  </text>

</svg>
